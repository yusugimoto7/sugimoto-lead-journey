# Hourly build of the static dashboard (tools/build-pack.js) and its publication on GitHub Pages. The data file is
# encrypted with PACK_PASSWORD and carries no name, email or phone; the page asks for the password.
name: Static dashboard

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: static-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build the page and the encrypted data file
        run: node --max-old-space-size=1500 tools/build-pack.js
        env:
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_USERNAME: ${{ secrets.ODOO_USERNAME }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
          # The page opens with the server's password unless a separate one is set. The hash key only needs to be
          # secret and never shipped, so the Odoo key serves when PACK_KEY is not set.
          PACK_PASSWORD: ${{ secrets.PACK_PASSWORD || secrets.DASHBOARD_PASSWORD }}
          PACK_KEY: ${{ secrets.PACK_KEY || secrets.ODOO_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sugimoto Lead Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f6f6f4;--card:#fff;--ink:#16181d;--mute:#6b7280;--line:#e5e5e0;--accent:#2f4b7c;--accent-rgb:47,75,124;
--c1:#2f4b7c;--c2:#c2792b;--c3:#3f8f7a;--c4:#a84a5c;--c5:#7a6aa8;--good:#2e7d5b;--bad:#b3413a}
:root[data-theme=dark]{--bg:#0f1115;--card:#171a20;--ink:#eceef2;--mute:#8d95a3;--line:#262a33;--accent:#7ea2e0;--accent-rgb:126,162,224;
--c1:#7ea2e0;--c2:#e0a15c;--c3:#6cc3aa;--c4:#e07f93;--c5:#a999d6;--good:#5cc79a;--bad:#e5776f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif}
.mono,.num{font-family:'DM Mono',monospace}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);background:var(--card)}
h1{font-size:17px;margin:0;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:12px}
button,select,input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
button{cursor:pointer}button:hover{border-color:var(--accent)}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 20px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
nav button{border:0;background:none;white-space:nowrap;color:var(--mute);padding:8px 12px;border-radius:6px}
nav button.on{background:rgba(var(--accent-rgb),.12);color:var(--accent);font-weight:600}
main{padding:20px;max-width:1280px;margin:0 auto}
section{display:none}section.on{display:block}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.card h3{margin:0 0 10px;font-size:13px;font-weight:600}
.kpi .l{color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font:500 24px 'DM Mono',monospace;margin-top:4px}
.kpi .s{color:var(--mute);font-size:11px;margin-top:2px}
.chart{position:relative;height:300px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
td.r,th.r{text-align:right;font-family:'DM Mono',monospace}
.scroll{overflow:auto;max-height:560px}
.bar{height:26px;border-radius:4px;background:rgba(var(--accent-rgb),.85);display:flex;align-items:center;padding:0 8px;color:#fff;font:500 12px 'DM Mono',monospace;white-space:nowrap;min-width:fit-content}
.frow{display:grid;grid-template-columns:minmax(120px,210px) 1fr;gap:10px;align-items:center;margin:6px 0}
.frow .n{font-size:12px}.frow .n small{color:var(--mute);display:block}
.stages{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;border:1px solid var(--line)}
.pill.Converted{color:var(--good);border-color:var(--good)}.pill.Lost{color:var(--bad);border-color:var(--bad)}
.note{color:var(--mute);font-size:12px;padding:10px 0}
.warn{background:rgba(179,65,58,.1);border:1px solid var(--bad);color:var(--bad);padding:10px 14px;border-radius:8px;margin-bottom:14px;display:none}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.filters input{min-width:200px}.filters select{max-width:170px}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px}
tr.click{cursor:pointer}tr.click:hover td{background:rgba(var(--accent-rgb),.06)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);max-width:640px;width:calc(100% - 32px);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.5)}
dl{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;margin:0}dt{color:var(--mute)}dd{margin:0;word-break:break-word}
.pill.Historical{color:var(--mute);border-style:dashed}
.scope{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.banner{background:rgba(var(--accent-rgb),.1);border:1px solid rgba(var(--accent-rgb),.35);padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:12.5px;display:none}
.loading{color:var(--mute);padding:40px;text-align:center}
#pbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 20px;border-bottom:1px solid var(--line);background:var(--card)}
#market{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}#market button{border:0;border-radius:0;background:none;padding:6px 12px}#market button.on{background:rgba(var(--accent-rgb),.14);color:var(--accent);font-weight:600}
#pbar button.on{background:rgba(var(--accent-rgb),.14);color:var(--accent);font-weight:600}
#pbar .sub{margin-left:6px}
.up{color:#1a8a4a}.down{color:#c0392b}
@media(max-width:600px){#pbar{padding:8px 12px}main{padding:12px}header,nav{padding-left:12px;padding-right:12px}.chart{height:260px}dl{grid-template-columns:100px 1fr}}
</style>
</head>
<body>
<header>
  <div><h1>Sugimoto Visa · Lead Journey</h1><div class="sub" id="status">Connecting to Odoo…</div></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><div class="seg" id="market" role="group" aria-label="Market"><button data-m="">All markets</button><button data-m="Canada">Canada</button><button data-m="Europe">Europe</button></div><label class="scope">Data scope <select id="scope" aria-label="Data scope"><option value="native">Native only</option><option value="historical">Historical only</option><option value="all">All leads</option></select></label><button id="refresh">Refresh from Odoo</button><button id="theme" aria-label="Toggle theme">Theme</button></div>
</header>
<nav id="tabs"></nav>
<div id="pbar"></div>
<main>
  <div class="warn" id="err"></div><div class="banner" id="banner"></div>
  <section id="t-overview"></section><section id="t-sources"></section><section id="t-journey"></section>
  <section id="t-segments"></section><section id="t-lost"></section><section id="t-sales"></section>
  <section id="t-deep"></section><section id="t-contracts"></section><section id="t-revenue"></section><section id="t-retarget"></section><section id="t-leads"></section>
</main>
<dialog id="dlg"></dialog>
<script>
const TABS=[['overview','Overview'],['sources','Lead Sources'],['journey','Lead Journey'],['segments','Segments'],['lost','Lost Leads'],['sales','Sales Performance'],['deep','Deep Analysis'],['contracts','Contracts'],['revenue','Revenue check'],['retarget','Retargeting'],['leads','All Leads']];
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n0=v=>v==null?'–':Number(v).toLocaleString('en-US',{maximumFractionDigits:0});
const money=(v,c)=>c==='EUR'?'€'+n0(v):'C$'+n0(v);
// Growth against the window of the same length just before the selected one (absent for "All time").
const gpct=(c,p)=>p?Math.round(((c||0)-p)/p*100):null;
const vs=(c,p)=>{if(p==null)return '';if(!p)return c?'new (0 the previous period)':'0 the previous period too';const v=gpct(c,p);return `<span class="${v>0?'up':v<0?'down':''}">${v>0?'+':''}${v}%</span> vs previous period (${n0(p)})`};
const gcell=(c,p)=>{if(p==null)return '–';if(!p)return c?'<span class="up">new</span>':'–';const v=gpct(c,p);return `<span class="${v>0?'up':v<0?'down':''}">${v>0?'+':''}${v}%</span>`};
const byName=(a,k='name')=>new Map((a||[]).map(x=>[x[k],x]));
// Table of the top rows with their previous-period value and growth, closed by a Total row over all rows
// (counts summed, rate recomputed). Each row gets r._prev (its previous-period row) for the extra columns.
const SUMS=['total','count','converted','lost','open','historical','rateBase'];
function totalOf(rows,key){if(!rows)return null;const t={[key]:'Total',_total:true};SUMS.forEach(k=>{if(rows.some(r=>typeof r[k]==='number'))t[k]=rows.reduce((a,r)=>a+(r[k]||0),0)});if('rateBase' in t||'total' in t)t.rate=Math.round((t.converted||0)/Math.max(1,t.rateBase??t.total)*1000)/10;if(rows.some(r=>'share' in r))t.share=100;return t}
function growthTable(cur,prev,label,{key='name',val='total',limit=15,extra=[],totals=true}={}){
  const pm=prev?byName(prev,key):null;
  const tot=totals&&cur.length?totalOf(cur,key):null;
  if(tot&&prev)tot._prev=totalOf(prev,key);
  const row=(r,bold)=>{if(!r._total&&pm)r._prev=pm.get(r[key])||null;const pr=pm?(r._prev||{})[val]||0:null;const b=bold?' style="font-weight:600;border-top:2px solid var(--line)"':'';
    return `<tr${b}><td>${esc(r[key]??'(none)')}</td><td class="r">${n0(r[val])}</td>${pm?`<td class="r">${n0(pr)}</td><td class="r">${gcell(r[val],pr)}</td>`:''}${extra.map(e=>`<td class="r">${e[1](r)}</td>`).join('')}</tr>`};
  return `<div class="scroll"><table><tr><th>${esc(label)}</th><th class="r">Now</th>${pm?'<th class="r">Before</th><th class="r">Growth</th>':''}${extra.map(e=>`<th class="r">${e[0]}</th>`).join('')}</tr>${cur.slice(0,limit).map(r=>row(r,false)).join('')}${tot?row(tot,true):''}</table></div>${cur.length>limit?`<div class="note">Top ${limit} of ${n0(cur.length)} shown; Total covers all.</div>`:''}`;
}
const store={};let charts={};let current='overview';let scope='native';try{scope=localStorage.getItem('scope')||'native'}catch(e){}
let market='';try{market=localStorage.getItem('market')||''}catch(e){}

// Every call carries the scope and, unless it is "All time", the selected window (lead date: Created on / Created at).
async function api(p){
  const w=periodDates(),q=new URLSearchParams({scope});if(market)q.set('market',market);
  if(w&&!/[?&]from=/.test(p)&&!p.startsWith('/api/status')){q.set('from',w[0]);q.set('to',w[1])}
  const r=await fetch(p+(p.includes('?')?'&':'?')+q);const t=await r.text();let j=null;try{j=JSON.parse(t)}catch(e){}
  if(!r.ok||!j){const e=new Error(j&&j.error||`Server answered ${r.status} ${r.statusText||''}`.trim());e.syncing=!!(j&&j.syncing)||r.status===502&&!j||r.status===504;throw e}
  return j}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function cached(k){const key=k+'|'+market+'|'+(periodDates()||['all']).join('~');return store[key]||(store[key]=await api('/api/'+k))}
function col(i){return getComputedStyle(document.documentElement).getPropertyValue('--c'+((i%5)+1)).trim()}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function mk(id,cfg){if(charts[id])charts[id].destroy();
  cfg.options=Object.assign({responsive:true,maintainAspectRatio:false},cfg.options||{});
  charts[id]=new Chart(document.getElementById(id),cfg)}
const kpi=(l,v,s='')=>`<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
const card=(t,body)=>`<div class="card"><h3>${t}</h3>${body}</div>`;
const canvas=id=>`<div class="chart"><canvas id="${id}"></canvas></div>`;
function applyChartTheme(){Chart.defaults.color=css('--mute');Chart.defaults.borderColor=css('--line');Chart.defaults.font.family='Inter'}

function heat(m,label){
  if(!m.rows.length)return '<div class="note">No data.</div>';
  const max=Math.max(1,...m.cells.flat());
  return `<div class="scroll"><table><tr><th>${label}</th>${m.cols.map(c=>`<th class="r">${esc(c)}</th>`).join('')}</tr>`+
  m.rows.map((r,i)=>`<tr><td>${esc(r)}</td>${m.cells[i].map(v=>`<td class="r" style="background:rgba(var(--accent-rgb),${(v/max*.75).toFixed(2)})">${v||''}</td>`).join('')}</tr>`).join('')+'</table></div>';
}

const R={};
const RANGES=[['3d','3 days',3],['7d','7 days',7],['2w','2 weeks',14],['1m','1 month',30],['3m','3 months',91],['6m','6 months',182],['1y','1 year',365],['all','All time',0],['custom','Custom',0]];
const BCOL={'Pre meeting':()=>col(0),'Meeting set and done':()=>col(1),'Documents received':()=>col(4),'Contract sent':()=>col(3),'Signed':()=>col(2),'Archive':()=>css('--mute'),'Other':()=>'#c9c8c0'};
const MAIN_B=['Pre meeting','Meeting set and done','Documents received','Contract sent','Signed','Archive'];
let P={range:'7d',from:'',to:'',basis:'created',dim:'source',source:'',medium:''};
try{P=Object.assign(P,JSON.parse(localStorage.getItem('period')||'{}'))}catch(e){}
const isoDay=d=>d.toISOString().slice(0,10);
function periodDates(){
  if(P.range==='all')return null;
  if(P.range==='custom'&&P.from&&P.to)return [P.from,P.to];
  // Custom without both dates falls back to the last month.
  const r=RANGES.find(x=>x[0]===P.range&&x[2])||RANGES[3];const to=new Date();return [isoDay(new Date(to-(r[2]-1)*864e5)),isoDay(to)];
}
function renderPbar(){
  const w=periodDates();
  let prev='';if(w){const a=Date.parse(w[0]+'T00:00:00Z'),b=Date.parse(w[1]+'T00:00:00Z'),n=Math.round((b-a)/864e5)+1;prev=`compared with ${isoDay(new Date(a-n*864e5))} → ${isoDay(new Date(a-864e5))}`}
  $('#pbar').innerHTML=RANGES.map(([k,l])=>`<button data-r="${k}" class="${P.range===k?'on':''}">${l}</button>`).join('')+
    (P.range==='custom'?`<input type="date" id="pf" value="${esc(w?w[0]:'')}"> – <input type="date" id="pt" value="${esc(w?w[1]:'')}">`:'')+
    `<span class="sub">${market?`<b>${esc(market)} only</b> · `:''}${w?`${w[0]} → ${w[1]} · ${prev}`:'All time, no comparison'} · by lead date (Created on; Created at for imported cards)</span>`;
  const apply=()=>{try{localStorage.setItem('period',JSON.stringify(P))}catch(e){}renderPbar();document.querySelectorAll('section').forEach(x=>{if(x.id!=='t-'+current)x.innerHTML=''});show(current)};
  $('#pbar').querySelectorAll('button[data-r]').forEach(b=>b.onclick=()=>{const w0=periodDates();P.range=b.dataset.r;if(P.range==='custom'&&!(P.from&&P.to)){const d=w0||[isoDay(new Date(Date.now()-29*864e5)),isoDay(new Date())];P.from=d[0];P.to=d[1]}apply()});
  ['pf','pt'].forEach(id=>{const x=$('#'+id);if(x)x.onchange=()=>{P[id==='pf'?'from':'to']=x.value;if(P.from&&P.to&&P.from<=P.to)apply()}});
}
async function renderPeriod(box){
  try{localStorage.setItem('period',JSON.stringify(P))}catch(e){}
  const [from,to]=periodDates()||[isoDay(new Date(Date.now()-29*864e5)),isoDay(new Date())];
  const q=new URLSearchParams({from,to,basis:P.basis,dim:P.dim,source:P.source,medium:P.medium});
  const d=await api('/api/period?'+q);
  const delta=(a,b)=>vs(a,b);
  const shown=[...MAIN_B,...['Other'].filter(b=>d.current[b]||d.previous[b])];
  const opt=(k,label,opts,cur)=>`<select data-p="${k}"><option value="">${label}</option>${opts.map(o=>`<option ${cur===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  box.innerHTML=`<div class="card" style="margin-bottom:14px"><h3>What happened in Odoo</h3>
   <div class="filters"><select data-p="basis"><option value="created" ${P.basis==='created'?'selected':''}>New leads (created in period)</option><option value="stage" ${P.basis==='stage'?'selected':''}>Stage moves (reached current stage in period)</option></select>
   <select data-p="dim">${[['source','By source'],['medium','By medium'],['budgetTier','By budget tier'],['campaign','By campaign'],['user','By salesperson'],['referrer','By referred by']].map(([k,l])=>`<option value="${k}" ${P.dim===k?'selected':''}>${l}</option>`).join('')}</select>
   ${opt('source','All sources',d.facets.source,P.source)}${opt('medium','All mediums',d.facets.medium,P.medium)}</div>
   <div class="note">${esc(d.from)} → ${esc(d.to)} (${d.span} days) · ${d.basis==='created'?'leads created in the period, shown in the stage group they are in now (recent leads have had less time to move on, so later groups look smaller; use Stage moves to see activity)':'cards whose current stage was reached in the period, i.e. what moved'} · native Odoo cards only${P.range==='all'?' · "All time" is selected, so this block shows the last 30 days':''}.</div>
   <div class="grid kpis">${kpi(d.basis==='created'?'New leads':'Cards moved',n0(d.total),delta(d.total,d.prevTotal))}${shown.map(b=>kpi(b,n0(d.current[b]),delta(d.current[b],d.previous[b]))).join('')}</div>
   <div class="grid two">${card(`Per ${d.unit}`,canvas('c-per'))}${card(`By ${({source:'source',medium:'medium',budgetTier:'budget tier',campaign:'campaign',user:'salesperson',referrer:'referred by'})[d.dim]}`,`<div class="scroll"><table><tr><th>${esc(d.dim)}</th><th class="r">Total</th>${shown.map(b=>`<th class="r">${esc(b)}</th>`).join('')}</tr>${d.rows.map(r=>`<tr><td>${esc(r.name)}</td><td class="r">${n0(r.total)}</td>${shown.map(b=>`<td class="r">${r[b]||''}</td>`).join('')}</tr>`).join('')}<tr style="font-weight:600;border-top:2px solid var(--line)"><td>Total</td><td class="r">${n0(d.total)}</td>${shown.map(b=>`<td class="r">${n0(d.current[b])}</td>`).join('')}</tr></table></div>${d.otherRows?`<div class="note">+${d.otherRows} more</div>`:''}`)}</div></div>`;
  mk('c-per',{type:'bar',data:{labels:d.timeline.map(x=>x.key),datasets:shown.map(b=>({label:b,data:d.timeline.map(x=>x[b]),backgroundColor:BCOL[b]()}))},options:{scales:{x:{stacked:true},y:{stacked:true}},plugins:{legend:{position:'bottom'}}}});
  box.querySelectorAll('[data-p]').forEach(x=>x.onchange=e=>{P[e.target.dataset.p]=e.target.value;renderPeriod(box)});
}
R.overview=async el=>{
  const s=await cached('summary'),t=s.totals,pt=s._prev?s._prev.totals:null,w=s._window;
  const h=s.historical,g=k=>pt?vs(t[k],pt[k]):'';
  const ser=s.series||{unit:'month',points:[]};
  el.innerHTML=`<div id="period"></div><h3 style="margin:18px 0 10px">${w?`Selected period ${esc(w.from)} → ${esc(w.to)}`:'All time'} (${scope==='native'?'native':scope})</h3>
  <div class="grid kpis">${kpi('Leads',n0(t.total),g('total')||(scope==='native'?'native leads':''))}${kpi('Lost',n0(t.lost),g('lost')||'inactive + reason')}${kpi('Pending',n0(t.open),g('open')||'open, not converted')}${kpi('Converted',n0(t.converted),g('converted')||'Stage 20-22 or Won')}${kpi('Conversion rate',t.rate+'%',pt?`${pt.rate}% the previous period`:'converted / leads')}</div>
  <div class="grid two">${card(`Leads per ${ser.unit}`,canvas('c-month')+'<div class="note">By lead date: Created on for Odoo cards, Created at for imported cards.</div>')}${card(w?'This period vs the previous one':'By year',canvas('c-year'))}</div>
  ${!w?card('Historical (imported) leads',h.total?`<div class="grid kpis" style="margin:0">${kpi('Imported',n0(h.total),n0(h.native)+' native leads')}${kpi('With a Created at date',n0(h.withRealDate),esc((h.realFrom||'').slice(0,10))+' to '+esc((h.realTo||'').slice(0,10)))}</div><div class="note">Imported cards (lost reason "Historical", and the 2026-09-25 sheet import) are dated by Created at. Their outcomes come from the contract sheets. Use the Data scope menu to browse them.</div>`:'<div class="note">No historical leads in this scope.</div>'):''}`;
  if(!ser.points.length)document.getElementById('c-month').parentElement.innerHTML='<div class="note">No dated leads in this scope and period.</div>';
  else mk('c-month',{type:'line',data:{labels:ser.points.map(m=>m.key),datasets:[
    {label:'Leads',data:ser.points.map(m=>m.total),borderColor:col(0),backgroundColor:col(0),pointRadius:ser.points.length>60?0:2,tension:.25},
    {label:'Converted',data:ser.points.map(m=>m.converted),borderColor:col(2),backgroundColor:col(2),pointRadius:ser.points.length>60?0:2,tension:.25}]},options:{interaction:{mode:'index',intersect:false}}});
  if(w&&pt)mk('c-year',{type:'bar',data:{labels:['Leads','Converted','Lost','Pending'],datasets:[
    {label:`Previous (${w.prevFrom} → ${w.prevTo})`,data:[pt.total,pt.converted,pt.lost,pt.open],backgroundColor:css('--mute')},
    {label:`Selected (${w.from} → ${w.to})`,data:[t.total,t.converted,t.lost,t.open],backgroundColor:col(0)}]}});
  else mk('c-year',{type:'bar',data:{labels:s.byYear.map(y=>y.year),datasets:[
    {label:'Total',data:s.byYear.map(y=>y.total),backgroundColor:col(0)},{label:'Converted',data:s.byYear.map(y=>y.converted),backgroundColor:col(2)},{label:'Lost',data:s.byYear.map(y=>y.lost),backgroundColor:col(3)}]}});
  await renderPeriod($('#period'));
};

function dual(id,rows,limit=15){
  rows=rows.slice(0,limit);
  mk(id,{data:{labels:rows.map(r=>r.name),datasets:[
    {type:'bar',label:'Leads',data:rows.map(r=>r.total),backgroundColor:col(0),yAxisID:'y'},
    {type:'line',label:'Conversion %',data:rows.map(r=>r.rate),borderColor:col(1),backgroundColor:col(1),yAxisID:'y1',tension:.2}]},
    options:{scales:{y:{position:'left',title:{display:true,text:'Leads'}},y1:{position:'right',grid:{drawOnChartArea:false},title:{display:true,text:'Conv. %'},ticks:{callback:v=>v+'%'}}}}});
}
R.sources=async el=>{
  const s=await cached('sources'),p=s._prev;
  const ref=a=>(a||[]).filter(r=>r.name!==null&&r.name!=='(none)');
  // One chart (top sources); everything else as tables with the previous period and growth.
  const ex=(prev)=>[['Signed',r=>n0(r.converted)],...(prev?[['Signed before',r=>n0((r._prev||{}).converted||0)]]:[]),['Rate',r=>r.rate+'%'],['Lost',r=>n0(r.lost)],['Open',r=>n0(r.open)]];
  const t=(title,cur,prev,label)=>card(`${title} (${n0(cur.length)})`,growthTable(cur,prev,label,{limit:60,extra:ex(prev)}));
  el.innerHTML=`${card('Top sources: leads and conversion rate',canvas('c-src'))}
  <div class="note">Signed = Stage 20, 21, 22, 25 or Won. Rate = signed / leads of the period. Odoo's UTM model has no separate "content" dimension, so campaign is the third cut.</div>
  ${t('Sources',s.source,p&&p.source,'Source')}
  ${t('Mediums',s.medium,p&&p.medium,'Medium')}
  ${t('Campaigns',s.campaign,p&&p.campaign,'Campaign')}
  ${t('Referred by: influencer page / partner',ref(s.referrer),p&&ref(p.referrer),'Referred by')}`;
  dual('c-src',s.source);
};

R.journey=async el=>{
  const j=await cached('journey'),p=j._prev;
  const pp=p?byName(p.phases,'phase'):null,ps=p?byName(p.stages,'stage'):null;
  // Bar = leads of the period that are in this group now, split into open / lost / archived; "reached" (this group or
  // later) is the funnel figure next to it.
  const max=Math.max(1,...j.phases.map(x=>x.current));
  const seg=(n,c,label)=>n?`<div title="${label}: ${n0(n)}" style="width:${n/max*100}%;background:${c};height:100%;display:inline-block"></div>`:'';
  el.innerHTML=card('Funnel by stage group',`<div class="note">Bar = leads of the period whose current/last stage is in this group (blue open, red lost, grey archived; signed leads in Signed). "Reached" = leads in this group or a later one, the funnel view. ${j.outside?n0(j.outside)+' leads sit in no stage group (TEST Column) and are left out.':''}</div>`+
    j.phases.map(x=>{const other=x.current-x.open-x.lost-x.archived;return `<div class="frow"><div class="n">${esc(x.phase)}<small>stages ${esc(x.range)}</small></div><div><div style="height:22px;border-radius:5px;overflow:hidden;background:var(--line);white-space:nowrap">${seg(x.open,col(0),'open')}${seg(x.lost,col(3),'lost')}${seg(x.archived,css('--mute'),'archived')}${seg(other,col(2),'signed')}</div><small class="sub"><b>${n0(x.current)}</b> here now (${n0(x.open)} open · ${n0(x.lost)} lost · ${n0(x.archived)} archived${other?` · ${n0(other)} signed`:''}) · <b>${n0(x.reached)}</b> reached this group or later${pp?` · ${vs(x.reached,(pp.get(x.phase)||{}).reached||0)}`:''}</small></div></div>`}).join(''))+
    `<div class="grid two" style="margin-top:14px">${card('Step conversion: this period vs the previous one',`<div class="scroll"><table><tr><th>Group</th><th class="r">Reached</th><th class="r">From previous step</th><th class="r">From start</th>${pp?'<th class="r">Reached before</th><th class="r">From previous before</th><th class="r">Growth</th>':''}</tr>${j.phases.map(x=>{const q=pp?pp.get(x.phase)||{}:null;return `<tr><td>${esc(x.phase)}</td><td class="r">${n0(x.reached)}</td><td class="r">${x.fromPrevious}%</td><td class="r">${x.fromStart}%</td>${q?`<td class="r">${n0(q.reached||0)}</td><td class="r">${q.fromPrevious??'–'}%</td><td class="r">${gcell(x.reached,q.reached||0)}</td>`:''}</tr>`}).join('')}</table></div><div class="note">From previous step = reached this group / reached the group before. Compare the two periods side by side to see where the funnel got better or worse.</div>`)}
    ${card('Groups by market',`<div class="scroll"><table><tr><th>Group</th><th class="r">Canada</th><th class="r">Europe</th><th class="r">Total</th></tr>${j.phases.map(x=>{const st=j.stages.filter(y=>y.phase===x.phase);return `<tr><td>${esc(x.phase)}</td><td class="r">${n0(st.reduce((a,y)=>a+y.canada,0))}</td><td class="r">${n0(st.reduce((a,y)=>a+y.europe,0))}</td><td class="r">${n0(x.current)}</td></tr>`}).join('')}</table></div><div class="note">Leads now in each group, split by destination market (use the market switch above to look at one market).</div>`)}</div>`+
    card('Stages: this period vs the previous one',`<div class="scroll"><table><tr><th>Stage</th><th class="r">Now</th>${ps?'<th class="r">Before</th><th class="r">Growth</th>':''}<th class="r">Share</th><th class="r">Open</th><th class="r">Lost</th><th class="r">Archived</th><th class="r">Canada</th><th class="r">Europe</th></tr>${[...j.phases.map(x=>x.phase),'Unstaged'].map(ph=>{const st=j.stages.filter(y=>(y.phase||'Unstaged')===ph);if(!st.length)return '';const tot=st.reduce((a,y)=>a+y.total,0),ptot=ps?st.reduce((a,y)=>a+((ps.get(y.stage)||{}).total||0),0):null;const all=j.stages.reduce((a,y)=>a+y.total,0);
      return `<tr style="font-weight:600;background:rgba(var(--accent-rgb),.06)"><td>${esc(ph)}</td><td class="r">${n0(tot)}</td>${ps?`<td class="r">${n0(ptot)}</td><td class="r">${gcell(tot,ptot)}</td>`:''}<td class="r">${Math.round(tot/Math.max(1,all)*1000)/10}%</td><td class="r">${n0(st.reduce((a,y)=>a+y.open,0))}</td><td class="r">${n0(st.reduce((a,y)=>a+y.lost,0))}</td><td class="r">${n0(st.reduce((a,y)=>a+y.archived,0))}</td><td class="r">${n0(st.reduce((a,y)=>a+y.canada,0))}</td><td class="r">${n0(st.reduce((a,y)=>a+y.europe,0))}</td></tr>`+
      st.map(y=>{const b=ps?(ps.get(y.stage)||{}).total||0:null;return `<tr><td style="padding-left:22px">${esc(y.stage)}</td><td class="r">${n0(y.total)}</td>${ps?`<td class="r">${n0(b)}</td><td class="r">${gcell(y.total,b)}</td>`:''}<td class="r">${Math.round(y.total/Math.max(1,all)*1000)/10}%</td><td class="r">${n0(y.open)}</td><td class="r">${n0(y.lost)}</td><td class="r">${n0(y.archived)}</td><td class="r">${n0(y.canada)}</td><td class="r">${n0(y.europe)}</td></tr>`}).join('')}).join('')}${(()=>{const S=k=>j.stages.reduce((a,y)=>a+(y[k]||0),0),tot=S('total'),pt=ps?p.stages.reduce((a,y)=>a+y.total,0):null;return `<tr style="font-weight:600;border-top:2px solid var(--line)"><td>Total</td><td class="r">${n0(tot)}</td>${ps?`<td class="r">${n0(pt)}</td><td class="r">${gcell(tot,pt)}</td>`:''}<td class="r">100%</td><td class="r">${n0(S('open'))}</td><td class="r">${n0(S('lost'))}</td><td class="r">${n0(S('archived'))}</td><td class="r">${n0(S('canada'))}</td><td class="r">${n0(S('europe'))}</td></tr>`})()}</table></div>`);
};

const CMPS={dim:'path',values:''};
const CMPL={path:'Immigration path (lead)',advisor:"Consultant's path",budget:'Budget tier',market:'Market',source:'Source',medium:'Medium'};
async function renderCompare(box){
  const d=await api('/api/compare?'+new URLSearchParams({dim:CMPS.dim,...(CMPS.values?{values:CMPS.values}:{})}));
  const pv=d._prev?byName([d._prev.total,...d._prev.items]):null;
  const rows=[d.total,...d.items];
  box.innerHTML=card('Compare',`<div class="filters"><select id="cmp-dim">${Object.entries(CMPL).map(([k,v])=>`<option value="${k}" ${d.dim===k?'selected':''}>${esc(v)}</option>`).join('')}</select><span class="sub">Pick values to compare with all leads of the period:</span></div>
  <div style="display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:10px">${d.options.slice(0,30).map(o=>`<label class="sub" style="cursor:pointer"><input type="checkbox" value="${esc(o.name)}" ${d.chosen.includes(o.name)?'checked':''}> ${esc(o.name)} (${n0(o.n)})</label>`).join('')}</div>
  <div class="grid two">${card('Leads per '+(rows[0].series.unit||'month'),canvas('c-cmp'))}<div class="scroll"><table><tr><th></th><th class="r">Leads</th><th class="r">Share</th>${pv?'<th class="r">Before</th><th class="r">Growth</th>':''}<th class="r">Signed</th><th class="r">Rate</th><th class="r">Lost</th><th class="r">Open</th></tr>${rows.map((r,i)=>{const b=pv?(pv.get(r.name)||{total:0}).total:null;return `<tr style="${i?'':'font-weight:600'}"><td>${esc(r.name)}</td><td class="r">${n0(r.total)}</td><td class="r">${r.share}%</td>${pv?`<td class="r">${n0(b)}</td><td class="r">${gcell(r.total,b)}</td>`:''}<td class="r">${n0(r.converted)}</td><td class="r">${r.rate}%</td><td class="r">${n0(r.lost)}</td><td class="r">${n0(r.open)}</td></tr>`}).join('')}</table></div></div>`);
  const keys=d.total.series.points.map(p=>p.key);
  mk('c-cmp',{type:'line',data:{labels:keys,datasets:rows.map((r,i)=>{const m=new Map(r.series.points.map(p=>[p.key,p.total]));return {label:r.name,data:keys.map(k=>m.get(k)||0),borderColor:i?col(i-1):css('--mute'),backgroundColor:i?col(i-1):css('--mute'),borderDash:i?[]:[4,4],pointRadius:keys.length>40?0:2,tension:.25}})},options:{interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom'}}}});
  $('#cmp-dim').onchange=e=>{CMPS.dim=e.target.value;CMPS.values='';renderCompare(box)};
  box.querySelectorAll('input[type=checkbox]').forEach(x=>x.onchange=()=>{CMPS.values=[...box.querySelectorAll('input[type=checkbox]:checked')].map(c=>c.value).join('|');renderCompare(box)});
}
R.segments=async el=>{
  const s=await cached('segments');
  const blocks=[['budget','Budget distribution'],['immigration','Immigration paths'],['destination','Destination split']];
  const p=s._prev,bt=s.budgetTiers||[],pb=p?byName(p.budgetTiers):null,bmax=Math.max(1,...bt.map(x=>x.share));
  const mix=bt.filter(x=>x.total||x.name.startsWith('Tier')).map((x,i)=>`<div style="margin:10px 0 14px"><div style="display:flex;justify-content:space-between;gap:8px"><div><span style="display:inline-block;width:11px;height:11px;border-radius:3px;background:${x.name.startsWith('Tier')?col(0):css('--mute')};opacity:${x.name.startsWith('Tier')?(.45+i*.12).toFixed(2):1};margin-right:8px"></span><b>${esc(x.name)}</b><div class="sub" style="margin-left:19px">${esc(x.desc)}</div></div><div style="text-align:right;white-space:nowrap"><b>${x.share}%</b> <span class="sub">· ${n0(x.total)}</span>${pb?`<div class="sub">${gcell(x.total,(pb.get(x.name)||{}).total||0)}</div>`:''}</div></div><div style="height:6px;background:var(--line);border-radius:4px;margin-top:6px"><div style="height:6px;border-radius:4px;background:${col(0)};width:${(x.share/bmax*100).toFixed(1)}%"></div></div></div>`).join('');
  el.innerHTML=`<div id="cmp"></div><div class="grid two">${card('Budget mix',mix+'<div class="note">Tiers from the Budget field (toman, CAD or EUR answer). Historical cards without it use the old form answer when it is wholly under 2B toman; other old answers cross the tiers and stay Unscored.</div>')}${card('Budget tiers: can they start a process?',growthTable(bt.filter(x=>x.total||(pb&&(pb.get(x.name)||{}).total)),p&&p.budgetTiers,'Tier',{limit:10,extra:[['Share',r=>(r.share??'')+'%'],['Signed',r=>n0(r.converted)],['Rate',r=>r.rate+'%'],['Lost',r=>n0(r.lost)],['Open',r=>n0(r.open)]]}))}</div>
  <div class="grid two">${blocks.map(([k,t])=>s[k]?card(`${t} <span class="sub mono">${esc(s[k].field)}</span>`,canvas('c-'+k)+growthTable(s[k].data,p&&p[k]&&p[k].data,t.split(' ')[0],{limit:12,extra:[['Converted',r=>n0(r.converted)]]})):card(t,'<div class="note">No matching custom field found on crm.lead (looked for names/labels containing budget / immigration, program, path / destination). Check /api/status → fields.</div>')).join('')}${card('Destination (market)',canvas('c-country')+growthTable(s.market,p&&p.market,'Market',{limit:6,extra:[['Signed',r=>n0(r.converted)],['Rate',r=>r.rate+'%']]})+'<div class="note">From the Destination field (else the Canada/Europe tag, source, budget currency or contract currency). Imported historical leads before summer 2024 are Canada. Odoo\'s Country field is the residence country and is almost always empty, so it is not shown.</div>')}</div>`;
  for(const [k] of blocks) if(s[k]){const d=s[k].data.slice(0,12);
    mk('c-'+k,{type:k==='immigration'?'bar':'doughnut',data:{labels:d.map(x=>x.name),datasets:[{label:'Leads',data:d.map(x=>x.total),backgroundColor:d.map((_,i)=>col(i))}]},options:k==='immigration'?{indexAxis:'y',plugins:{legend:{display:false}}}:{}})}
  const c=s.market;
  mk('c-country',{type:'doughnut',data:{labels:c.map(x=>x.name),datasets:[{label:'Leads',data:c.map(x=>x.total),backgroundColor:c.map((_,i)=>col(i))}]}});
  await renderCompare($('#cmp'));
};

async function renderReconcile(el){
  const c=await cached('contracts');
  if(!c.available){el.innerHTML='<div class="note">The contracts feed (n8n) could not be read yet. It is retried on every Odoo sync.</div>';return}

    sheet:['Sheet status',r=>esc(r.sheetStatus||'–')],type:['Type',r=>esc(r.type||'–')],signed:['Signed',r=>`<span class="mono" style="white-space:nowrap">${esc(r.signed||'–')}</span>${r.dateFlags?`<div class="sub">${esc(r.dateFlags)}</div>`:''}`],
    rows:['Contracts',r=>`<span class="sub">${esc(r.rows)}</span>`],card:['Odoo card',r=>r.id?(r.importedCard?'imported later':r.historical?'historical':'native'):'none'],

  current=tab;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==='t-'+tab));
  const el=$('#t-'+tab);
  if(!el.innerHTML)el.innerHTML='<div class="loading">Loading from Odoo… the first sync of ~38k leads can take a minute.</div>';
  $('#err').style.display='none';
  location.hash=tab;
  for(let i=0;;i++){
    try{applyChartTheme();await R[tab](el);status();return}
    catch(e){
      if(current!==tab)return;
      if(e.syncing&&i<120){el.innerHTML='<div class="loading">Syncing leads from Odoo… the first load can take a few minutes. This page retries automatically.</div>';await sleep(4000);continue}
      el.innerHTML='';$('#err').textContent='Could not load data: '+e.message;$('#err').style.display='block';return}
  }
}
async function status(){
  try{const s=await api('/api/status');
    $('#status').textContent=(s.last_sync?`${n0(s.native_leads)} native + ${n0(s.historical_leads)} historical leads · synced ${Math.round(s.cache_age_seconds/60)} min ago`:'No data yet')+(s.syncing?' · syncing…':'')+(s.last_error?' · last sync error: '+s.last_error:'');
    if(s.syncing)setTimeout(status,5000);
    return s;
  }catch(e){$('#status').textContent='Not connected: '+e.message}
}
$('#tabs').innerHTML=TABS.map(([k,l])=>`<button data-t="${k}">${l}</button>`).join('');
$('#tabs').onclick=e=>{if(e.target.dataset.t)show(e.target.dataset.t)};
$('#refresh').onclick=async()=>{const b=$('#refresh');b.disabled=true;b.textContent='Refreshing…';
  try{
    const before=(await api('/api/status')).last_sync;
    await api('/api/refresh');
    for(let i=0;i<200;i++){await sleep(3000);const s=await status();
      if(s&&!s.syncing){if(s.last_error&&s.last_sync===before)throw new Error(s.last_error);break}}
    Object.keys(store).forEach(k=>delete store[k]);document.querySelectorAll('section').forEach(s=>{s.innerHTML='';delete s.dataset.init});
    await show(current)}
  catch(e){$('#err').textContent='Refresh failed: '+e.message;$('#err').style.display='block'}
  b.disabled=false;b.textContent='Refresh from Odoo'};
function banner(){const b=$('#banner');
  b.style.display=scope==='native'?'none':'block';
  b.textContent=scope==='historical'?'Historical only: imported cards (lost reason Historical, and the 2026-09-25 sheet import), dated by Created at. Signings come from the contract sheets; they are never counted as lost.':'All leads: native Odoo cards (Created on) plus imported cards (Created at). Imported cards are never counted as lost; their signings come from the contract sheets.'}
$('#scope').value=scope;banner();
$('#scope').onchange=e=>{scope=e.target.value;try{localStorage.setItem('scope',scope)}catch(x){}banner();
  Object.keys(store).forEach(k=>delete store[k]);document.querySelectorAll('section').forEach(s=>{s.innerHTML='';delete s.dataset.init});F.page=1;show(current)};
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('theme',t)}catch(e){}}
$('#theme').onclick=()=>{setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');if(current!=='leads')show(current)};
let saved=null;try{saved=localStorage.getItem('theme')}catch(e){}
setTheme(saved||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
function renderMarket(){document.querySelectorAll('#market button').forEach(b=>b.classList.toggle('on',b.dataset.m===market))}
document.querySelectorAll('#market button').forEach(b=>b.onclick=()=>{market=b.dataset.m;try{localStorage.setItem('market',market)}catch(e){}renderMarket();renderPbar();
  document.querySelectorAll('section').forEach(x=>{if(x.id!=='t-'+current)x.innerHTML=''});show(current)});
renderMarket();
renderPbar();
status();
show(TABS.some(t=>t[0]===location.hash.slice(1))?location.hash.slice(1):'overview');
</script>
</body>
